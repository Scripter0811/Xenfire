<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="auth-screen" class="auth-screen">
  <div class="auth-card">
    <h1>Chat</h1>
    <p class="auth-sub">Sign in to continue</p>
    <input id="auth-email" type="email" placeholder="Email" autocomplete="email">
    <input id="auth-password" type="password" placeholder="Password" autocomplete="current-password">
    <div class="auth-error" id="auth-error"></div>
    <button id="btn-signin" class="btn-primary">Sign in</button>
    <button id="btn-signup" class="btn-secondary">Create account</button>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="sidebar-top">
      <button id="btn-new-chat" class="new-chat-btn">
        <span class="plus">+</span> New chat
      </button>
    </div>
    <div id="conversation-list" class="conversation-list"></div>
    <div class="sidebar-bottom">
      <div id="user-email" class="user-email"></div>
      <button id="btn-signout" class="signout-btn">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <div id="messages" class="messages">
      <div class="empty-state" id="empty-state">
        <h2>What can I help with?</h2>
      </div>
    </div>

    <div class="composer">
      <div class="composer-inner">
        <textarea id="input" placeholder="Message..." rows="1"></textarea>
        <button id="btn-send" class="send-btn" aria-label="Send">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 13V3M8 3L3 8M8 3l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </main>
</div>

<script type="module" src="firebase-config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
